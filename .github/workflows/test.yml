name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install iyi
        run: |
          curl -fsSL https://raw.githubusercontent.com/iyilang/iyi/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: iyi test
      # A consumer reads the module's exported signatures from a .iyimod;
      # this fails when one of them is not fully typed.
      - name: Check the exported surface
        run: iyi build slang_test.iyi --emit-iyimod "$RUNNER_TEMP/iyimod" -o "$RUNNER_TEMP/slang_test"
